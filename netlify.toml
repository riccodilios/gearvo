# Netlify build config for Gearvo (Next.js + Prisma + Supabase)
# Set DATABASE_URL in Netlify env (Supabase pooler). Migrations are applied from CI/local;
# keep generate in the build so the client matches the schema.

[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Keep open tabs on the deploy they loaded (avoids stale Server Action IDs).
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
